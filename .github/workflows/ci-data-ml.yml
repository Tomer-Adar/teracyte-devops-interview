# Data/ML delivery: training/evaluation assets. Builds no Dev image and selects nothing for production;
# it produces a candidate (model + evaluation) as a workflow artifact for the handoff discussed in the interview.
name: ci-data-ml

on:
  push:
    branches: [main]
    paths: &ml-paths
      - examples/model_lifecycle/**
      - tests/test_model_lifecycle.py
      - '**/requirements*.txt'
      - .github/workflows/ci-data-ml.yml
  pull_request:
    paths: *ml-paths
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "**/requirements*.txt"
      - run: python -m pip install -r requirements-local.txt
      - run: python -m pytest -q tests/test_model_lifecycle.py
      - name: Train and evaluate
        run: python -m examples.model_lifecycle.train --output-dir candidate | tee training.log
      - name: Evaluation gate (MSE threshold and beats baseline)
        run: jq -e '.test_mse <= 0.001 and .test_mse < .baseline_test_mse' candidate/evaluation.json
      - name: Record digest
        run: sha256sum candidate/model.json | tee candidate/model.json.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: model-candidate-${{ github.sha }}
          path: |
            training.log
            candidate/
